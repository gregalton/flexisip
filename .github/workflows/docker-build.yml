# Workflow for building Docker image for flexisip
name: Build Docker Image

on:
  push:
    branches: [ "feature/extended-registration-cleanup-port", "release/2.4-extended-registration" ]
  pull_request:
    branches: [ "feature/extended-registration-cleanup-port", "release/2.4-extended-registration" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: false

    - name: Clone required submodules from GitHub mirrors
      run: |
        # gitlab.linphone.org is unreliable from GitHub Actions runners.
        # Only two submodules are required for the build:
        #   - linphone-sdk (cmake LINPHONESDK_DIR)
        #   - sofia-sip (always built from submodule via ExternalDependencies.cmake)
        # The others (hiredis, jansson, jose) use system packages or disabled features.

        # 1. linphone-sdk — clone from GitHub mirror, checkout pinned commit
        git clone https://github.com/BelledonneCommunications/linphone-sdk.git linphone-sdk
        cd linphone-sdk
        git checkout 37945e7e7b5b1074a3a0c97b89d3cd806850f18e

        # Only init submodules Flexisip actually needs (per LinphoneSDK.cmake).
        # Video/audio codecs (aom, libvpx, ffmpeg, etc.) and platform plugins
        # (msoboe, msandroidcamera2, etc.) are disabled — skip them entirely.
        REQUIRED_SUBS=(
          belle-sip bctoolbox belr ortp liblinphone lime bzrtp
          mediastreamer2 bcunit belcard
          external/decaf external/srtp external/soci
        )

        git submodule init -- "${REQUIRED_SUBS[@]}"

        # Redirect initialized submodules from gitlab to GitHub mirrors
        for sub in "${REQUIRED_SUBS[@]}"; do
          orig_url=$(git config --file .gitmodules "submodule.${sub}.url" 2>/dev/null || true)
          if [ -z "$orig_url" ]; then continue; fi
          repo_name=$(echo "$orig_url" | sed 's|.*/||' | sed 's|\.git$||')
          github_url="https://github.com/BelledonneCommunications/${repo_name}.git"
          if git ls-remote --exit-code "$github_url" HEAD >/dev/null 2>&1; then
            echo "Redirecting ${sub} -> ${github_url}"
            git config "submodule.${sub}.url" "$github_url"
          else
            echo "WARNING: No GitHub mirror for ${sub}, keeping original"
          fi
        done

        git submodule update --recursive
        cd ..

        # 2. sofia-sip — GitHub mirror doesn't have the exact pinned commit (9a81ffa2),
        #    so use the bc branch HEAD which is Belledonne's maintained branch.
        git clone --branch bc https://github.com/BelledonneCommunications/sofia-sip.git submodules/externals/sofia-sip

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Debug directory contents
      run: |
        pwd
        ls -la
        echo "=== Dockerfile contents ==="
        cat Dockerfile

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        platforms: linux/amd64
        push: true
        tags: ghcr.io/${{ github.repository }}:latest
        no-cache: true 